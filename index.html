<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a7d4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Courses">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Courses</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--tx:#1c1c1e;--tx2:#6c6c70;--bd:#d8d8dc;--ac:#0a7d4f;--acbg:#e3f4ec;--ok:#1f7a3a;--okbg:#e2f3e6;--wa:#8a5a00;--wabg:#fdf0d5;--da:#b3261e;--dabg:#fbe5e3;--r:12px}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--tx:#f2f2f7;--tx2:#9a9aa0;--bd:#38383a;--ac:#3ecf8e;--acbg:#12382a;--ok:#6fd38a;--okbg:#14301c;--wa:#f2c25c;--wabg:#3a2d0c;--da:#ff8a80;--dabg:#3d1714}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
#app{display:flex;flex-direction:column;height:100%}
header{padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:var(--card);border-bottom:.5px solid var(--bd);display:flex;align-items:center;gap:8px}
header h1{font-size:20px;margin:0;font-weight:600;flex:1}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 16px 24px}
nav{display:flex;background:var(--card);border-top:.5px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--tx2);padding:8px 0 6px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:50px}
nav button.on{color:var(--ac)}
nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
button{font:inherit;color:var(--tx)}
.btn{min-height:44px;padding:0 14px;border-radius:var(--r);border:.5px solid var(--bd);background:var(--card);font-weight:500}
.btn.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.btn.w{width:100%}
.ibs{display:flex;gap:8px;flex-shrink:0}
.ib{width:46px;height:46px;border-radius:50%;border:0;display:flex;align-items:center;justify-content:center;padding:0}
.ib svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ib.ok{background:var(--okbg);color:var(--ok)}.ib.wa{background:var(--wabg);color:var(--wa)}.ib.da{background:var(--dabg);color:var(--da)}
.ib:active{transform:scale(.92)}
.btn.s{min-height:36px;padding:0 10px;font-size:14px}
.btn.ok{background:var(--okbg);color:var(--ok);border-color:transparent}
.btn.wa{background:var(--wabg);color:var(--wa);border-color:transparent}
.btn.da{background:var(--dabg);color:var(--da);border-color:transparent}
input[type=text],input:not([type]){width:100%;min-height:44px;border:.5px solid var(--bd);border-radius:var(--r);padding:0 12px;font:inherit;font-size:16px;background:var(--card);color:var(--tx)}
.row{display:flex;align-items:center;gap:8px}
.card{background:var(--card);border-radius:var(--r);padding:4px 14px;margin:10px 0}
.card.pad{padding:12px 14px}
.it{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:.5px solid var(--bd);min-height:48px}
.it:last-child{border-bottom:0}
.it .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.sub{font-size:13px;color:var(--tx2)}
.cat{font-size:13px;font-weight:600;color:var(--tx2);margin:16px 4px 2px;letter-spacing:.2px}
.chip{display:inline-flex;align-items:center;min-height:40px;padding:0 12px;margin:0 6px 6px 0;border-radius:20px;background:var(--acbg);color:var(--ac);border:0;font-size:15px}
.badge{font-size:12px;padding:3px 9px;border-radius:8px;font-weight:500}
.b-taken{background:var(--okbg);color:var(--ok)}.b-na{background:var(--wabg);color:var(--wa)}.b-del{background:var(--dabg);color:var(--da)}.b-dist{background:var(--acbg);color:var(--ac)}
.err{color:var(--da);font-size:13px;margin:6px 2px}
.note{background:var(--wabg);color:var(--wa);border-radius:var(--r);padding:10px 12px;font-size:14px;margin:10px 0}
.bar{height:5px;border-radius:3px;background:var(--bd);overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--ac)}
h2{font-size:22px;margin:4px 0 8px;font-weight:600}
.empty{text-align:center;color:var(--tx2);padding:32px 12px}
.act{display:flex;gap:8px;padding:0 0 12px}.act .btn{flex:1}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 70px);background:#2c2c2e;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="app">
<header><h1 id="title">Courses</h1></header>
<main id="main"></main>
<nav id="nav"></nav>
</div>
<div id="toast" role="status"></div>
<input type="file" id="file" accept="application/json,.json" hidden>
<script>
"use strict";
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)};
var cap=function(s){s=s.trim();return s.charAt(0).toUpperCase()+s.slice(1)};

/* ---------- Donnees par defaut (alignees sur les rayons d'un drive : Auchan, nov. 2026) ---------- */
var CAT_V=2;
var DEF_CATS=["Fruits et légumes","Pain, pâtisserie","Boucherie, volaille, poissonnerie","Charcuterie, traiteur","Produits laitiers, oeufs, fromages","Épicerie salée","Épicerie sucrée","Surgelés","Eaux, jus, soda","Vins, bières, alcools","Hygiène, beauté","Entretien, maison","Bébé","Animalerie","Autre"];
var DEF_ART={
"Fruits et légumes":["Pommes","Bananes","Oranges","Citrons","Tomates","Carottes","Pommes de terre","Oignons","Salade","Courgettes","Champignons","Ail"],
"Pain, pâtisserie":["Pain","Baguette","Pain complet","Croissants"],
"Boucherie, volaille, poissonnerie":["Poulet","Steak haché","Saumon"],
"Charcuterie, traiteur":["Jambon","Lardons","Saucisson","Foie gras"],
"Produits laitiers, oeufs, fromages":["Lait","Beurre","Yaourts nature","Fromage râpé","Oeufs","Crème fraîche","Camembert"],
"Épicerie salée":["Pâtes","Riz","Huile d'olive","Sel","Conserves de tomates","Moutarde","Ketchup","Thon en boîte","Chips","Olives"],
"Épicerie sucrée":["Café","Thé","Céréales","Confiture","Biscuits","Chocolat","Sucre","Farine"],
"Surgelés":["Pizza surgelée","Légumes surgelés","Glace"],
"Eaux, jus, soda":["Eau","Jus d'orange","Coca-Cola","Limonade"],
"Vins, bières, alcools":["Vin rouge","Vin blanc","Bière"],
"Hygiène, beauté":["Dentifrice","Savon","Shampoing","Déodorant"],
"Entretien, maison":["Lessive","Liquide vaisselle","Pastilles lave-vaisselle","Sacs poubelle","Papier toilette","Essuie-tout","Éponges","Piles","Ampoules"],
"Bébé":["Couches"],
"Animalerie":["Litière pour chat"]
};
/* Applique le catalogue par defaut sans supprimer d'articles : renomme, scinde les anciennes categories, reclasse par nom, ajoute les manquants. */
function applyCatalog(st){
  var RENAME={"Boulangerie":"Pain, pâtisserie","Boucherie et poissonnerie":"Boucherie, volaille, poissonnerie","Crémerie":"Produits laitiers, oeufs, fromages"};
  var SPLIT={"Épicerie":"Épicerie salée","Boissons":"Eaux, jus, soda","Hygiène et entretien":"Hygiène, beauté"};
  st.categories.forEach(function(c){if(RENAME[c.name])c.name=RENAME[c.name]});
  var by={};st.categories.forEach(function(c){by[c.name]=c});
  var ordered=DEF_CATS.map(function(n){return by[n]||{id:uid(),name:n}});
  var idx=function(n){return ordered.filter(function(c){return c.name===n})[0]};
  st.categories.forEach(function(c){
    if(SPLIT[c.name]){var t=idx(SPLIT[c.name]);st.articles.forEach(function(a){if(a.catId===c.id)a.catId=t.id})}
  });
  var custom=st.categories.filter(function(c){return !SPLIT[c.name]&&DEF_CATS.indexOf(c.name)<0});
  st.categories=ordered.slice(0,-1).concat(custom,ordered.slice(-1));
  Object.keys(DEF_ART).forEach(function(cn){
    var c=idx(cn);
    DEF_ART[cn].forEach(function(an){
      var n=norm(an),ex=st.articles.filter(function(a){return norm(a.name)===n})[0];
      if(ex)ex.catId=c.id;else st.articles.push({id:uid(),name:an,catId:c.id});
    });
  });
  st.cat=CAT_V;
  return st;
}
function seed(){return applyCatalog({v:1,cat:0,shops:[],categories:[],articles:[],list:[],next:[]})}
var needsCatalog=function(){return (S.cat||1)<CAT_V};

/* ---------- Stockage : IndexedDB + copie localStorage ---------- */
var S=null;
function idb(){return new Promise(function(res,rej){var r=indexedDB.open("courses",1);r.onupgradeneeded=function(){r.result.createObjectStore("kv")};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}
function idbGet(){return idb().then(function(db){return new Promise(function(res,rej){var q=db.transaction("kv").objectStore("kv").get("state");q.onsuccess=function(){res(q.result)};q.onerror=function(){rej(q.error)}})})}
function idbSet(v){return idb().then(function(db){return new Promise(function(res,rej){var t=db.transaction("kv","readwrite");t.objectStore("kv").put(v,"state");t.oncomplete=res;t.onerror=function(){rej(t.error)}})})}
function save(){
  try{localStorage.setItem("courses_state",JSON.stringify(S))}catch(e){}
  idbSet(S).catch(function(){});
}
function load(){
  return idbGet().catch(function(){return null}).then(function(v){
    if(!v){try{v=JSON.parse(localStorage.getItem("courses_state")||"null")}catch(e){v=null}}
    S=valid(v)?v:seed();
  });
}
function valid(v){return v&&Array.isArray(v.shops)&&Array.isArray(v.categories)&&Array.isArray(v.articles)&&Array.isArray(v.list)&&Array.isArray(v.next)}

/* ---------- Utilitaires ---------- */
function norm(s){
  return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/œ/g,"oe").replace(/[^a-z0-9 ]/g," ")
    .split(/\s+/).filter(Boolean).map(function(w){return w.length>3?w.replace(/(s|x)$/,""):w}).join(" ");
}
function lev(a,b){
  var m=a.length,n=b.length,p=[],i,j;
  for(j=0;j<=n;j++)p[j]=j;
  for(i=1;i<=m;i++){var prev=p[0];p[0]=i;for(j=1;j<=n;j++){var t=p[j];p[j]=Math.min(p[j]+1,p[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));prev=t}}
  return p[n];
}
function ratio(a,b){var l=Math.max(a.length,b.length);return l?1-lev(a,b)/l:1}
function similar(name,limit){
  var n=norm(name);if(n.length<2)return [];
  var out=[];
  S.articles.forEach(function(a){
    var an=norm(a.name),sc=0;
    if(an===n)sc=1;
    else if(an.indexOf(n)===0||n.indexOf(an)===0)sc=.9;
    else if(n.length>=3&&an.indexOf(n)>=0)sc=.8;
    else{
      sc=ratio(an,n);
      an.split(" ").forEach(function(t){sc=Math.max(sc,ratio(t,n)*.95)});
    }
    if(sc>=.6)out.push({a:a,sc:sc});
  });
  out.sort(function(x,y){return y.sc-x.sc});
  return out.slice(0,limit||4).map(function(o){return o.a});
}
function hav(lat1,lon1,lat2,lon2){
  var R=6371000,d=Math.PI/180,dl=(lat2-lat1)*d,dn=(lon2-lon1)*d;
  var a=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(lat1*d)*Math.cos(lat2*d)*Math.sin(dn/2)*Math.sin(dn/2);
  return 2*R*Math.asin(Math.sqrt(a));
}
var fmtD=function(m){return Math.round(m).toLocaleString("fr-FR")+" m"};
var art=function(id){return S.articles.find(function(a){return a.id===id})};
var cat=function(id){return S.categories.find(function(c){return c.id===id})};
var entry=function(id){return S.list.find(function(e){return e.articleId===id})};
function toast(t){var e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove("on")},2200)}
function getPos(hi){
  return new Promise(function(res,rej){
    if(!navigator.geolocation)return rej({message:"Géolocalisation indisponible."});
    navigator.geolocation.getCurrentPosition(function(p){res({lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy,ts:Date.now()})},
      function(e){rej({message:e.code===1?"Localisation refusée. Autorisez-la dans Réglages iOS > Safari > Localisation, ou pour l'application installée.":"Position introuvable. Réessayez."})},
      {enableHighAccuracy:hi!==false,timeout:15000,maximumAge:10000});
  });
}
function grouped(items){
  var by={};items.forEach(function(a){(by[a.catId]=by[a.catId]||[]).push(a)});
  return S.categories.filter(function(c){return by[c.id]}).map(function(c){return {cat:c,items:by[c.id].sort(function(x,y){return x.name.localeCompare(y.name,"fr")})}});
}
function todoArts(){return S.list.filter(function(e){return e.status==="todo"}).map(function(e){return art(e.articleId)}).filter(Boolean)}

/* ---------- Etat UI ---------- */
var ui={tab:"list",draft:"",mode:"typing",pending:"",err:null,shopId:null,sel:null,pos:null,locating:false,locErr:null,noloc:false,shopErr:null,busy:false};
var ICON={
  stores:'<svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
  list:'<svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1.2 1.2L6.8 5M3.5 12l1.2 1.2L6.8 11M3.5 18l1.2 1.2L6.8 17"/></svg>',
  run:'<svg viewBox="0 0 24 24"><path d="M3 4h2.5l2.2 10.5h10.3l2-7.5H6.4"/><circle cx="9" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg>',
  set:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>'
};
var IC={
  ok:'<svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
  na:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
  del:'<svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12h10l1-12M9 7V4h6v3"/></svg>'
};
var TABS=[["list","Liste"],["run","Courses"],["stores","Magasins"],["set","Réglages"]];
var TITLES={list:"Ma liste",run:"Faire les courses",stores:"Magasins",set:"Réglages"};

/* ---------- Vues ---------- */
function render(){
  $("#nav").innerHTML=TABS.map(function(t){return '<button data-act="tab" data-t="'+t[0]+'" class="'+(ui.tab===t[0]?"on":"")+'" aria-label="'+t[1]+'">'+ICON[t[0]==="list"?"list":t[0]]+'<span>'+t[1]+'</span></button>'}).join("");
  $("#title").textContent=ui.tab==="run"&&ui.shopId&&shopById(ui.shopId)?shopById(ui.shopId).name:TITLES[ui.tab];
  var v={list:viewList,run:viewRun,stores:viewStores,set:viewSet}[ui.tab]();
  $("#main").innerHTML=v;
  if(ui.tab==="list"){var q=$("#q");if(q){q.value=ui.draft;q.addEventListener("input",onType);q.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();act.submit()}})}}
  if(ui.tab==="stores"){var sn=$("#sn");if(sn)sn.value=ui.shopName||"";if(sn)sn.addEventListener("input",function(){ui.shopName=sn.value;ui.shopErr=null})}
}
var shopById=function(id){return S.shops.find(function(s){return s.id===id})};

function catBanner(){
  return '<div class="note">Nouveau catalogue de rayons disponible (aligné sur un drive). Vos articles, listes et magasins sont conservés.<div style="margin-top:8px"><button class="btn s p" data-act="catalog">Mettre à jour le catalogue</button></div></div>';
}
function sgHtml(){
  var h="";
  if(ui.err)h+='<div class="err">'+esc(ui.err)+'</div>';
  if(ui.mode==="typing"){
    var m=similar(ui.draft,5);
    if(m.length)h+='<div style="margin-top:10px">'+m.map(function(a){return '<button class="chip" data-act="pick" data-id="'+a.id+'">'+esc(a.name)+'</button>'}).join("")+'</div>';
  }else if(ui.mode==="confirm"){
    var s=similar(ui.pending,4);
    h+='<div class="card pad"><div class="sub">« '+esc(ui.pending)+' » n\'existe pas. Vous vouliez dire :</div><div style="margin-top:8px">'+
      s.map(function(a){return '<button class="chip" data-act="pick" data-id="'+a.id+'">'+esc(a.name)+'</button>'}).join("")+
      '</div><div class="act" style="padding-top:6px"><button class="btn" data-act="cancel">Annuler</button><button class="btn p" data-act="tocat">Non, créer « '+esc(ui.pending)+' »</button></div></div>';
  }else if(ui.mode==="cat"){
    h+='<div class="card pad"><div class="sub">Catégorie de « '+esc(ui.pending)+' »</div><div style="margin-top:8px">'+
      S.categories.map(function(c){return '<button class="chip" data-act="create" data-id="'+c.id+'">'+esc(c.name)+'</button>'}).join("")+
      '<button class="chip" style="background:var(--card);border:.5px solid var(--bd);color:var(--tx)" data-act="newcatcreate">+ Nouvelle catégorie</button></div>'+
      '<div class="act" style="padding-top:6px"><button class="btn" data-act="cancel">Annuler</button></div></div>';
  }
  return h;
}
function viewList(){
  var h=needsCatalog()?catBanner():"";
  h+='<div class="row"><input id="q" type="text" placeholder="Ajouter un article" autocomplete="off" autocorrect="off" autocapitalize="sentences" enterkeyhint="done" aria-label="Nom de l\'article"><button class="btn p" data-act="submit" aria-label="Ajouter" style="min-width:56px">Ajouter</button></div><div id="sg">'+sgHtml()+'</div>';
  if(S.next.length){
    h+='<div class="card pad"><div class="row"><div style="flex:1"><b>Prochains achats</b><div class="sub">'+S.next.length+' article(s) reportés</div></div><button class="btn s p" data-act="nextall">Tout ajouter</button></div><div style="margin-top:8px">'+
      S.next.map(function(id){var a=art(id);return a?'<span class="chip">'+esc(a.name)+'<button data-act="nextadd" data-id="'+id+'" aria-label="Ajouter" style="border:0;background:none;color:inherit;font-size:20px;padding:0 4px 0 8px;min-height:36px">+</button><button data-act="nextdel" data-id="'+id+'" aria-label="Retirer" style="border:0;background:none;color:inherit;font-size:18px;padding:0 0 0 4px;min-height:36px">×</button></span>':""}).join("")+'</div></div>';
  }
  var todo=todoArts(),g=grouped(todo);
  if(!todo.length)h+='<div class="empty">Votre liste est vide.<br>Saisissez un article ci-dessus.</div>';
  g.forEach(function(x){
    h+='<div class="cat">'+esc(x.cat.name.toUpperCase())+'</div><div class="card">'+x.items.map(function(a){return '<div class="it"><span class="nm">'+esc(a.name)+'</span><button class="btn s" data-act="rm" data-id="'+a.id+'" aria-label="Retirer '+esc(a.name)+'">Retirer</button></div>'}).join("")+'</div>';
  });
  var done=S.list.length-todo.length;
  if(done)h+='<div class="sub" style="text-align:center;margin-top:12px">'+done+' article(s) déjà traité(s), voir Courses.</div>';
  return h;
}

function locate(){
  ui.locating=true;ui.locErr=null;if(ui.tab==="run")render();
  getPos(true).then(function(p){ui.pos=p;ui.locating=false;ui.locErr=null}).catch(function(e){ui.locating=false;ui.locErr=e.message}).then(function(){if(ui.tab==="run")render()});
}
function viewRun(){
  var h="";
  if(!ui.shopId){
    h+='<h2>Où êtes-vous ?</h2>';
    if(!S.shops.length)return h+'<div class="empty">Aucun magasin enregistré.<br><button class="btn p" style="margin-top:12px" data-act="tab" data-t="stores">Ajouter un magasin</button></div>';
    if(ui.locating)h+='<div class="sub">Localisation en cours…</div>';
    if(ui.locErr)h+='<div class="note">'+esc(ui.locErr)+'</div>';
    var list=S.shops.map(function(s){return {s:s,d:ui.pos?hav(ui.pos.lat,ui.pos.lon,s.lat,s.lon):null}});
    if(ui.pos)list.sort(function(a,b){return a.d-b.d});else list.sort(function(a,b){return a.s.name.localeCompare(b.s.name,"fr")});
    h+='<div class="card">'+list.map(function(x){return '<div class="it" data-act="shop" data-id="'+x.s.id+'" style="cursor:pointer"><span class="nm">'+esc(x.s.name)+'</span>'+(x.d!==null?'<span class="badge b-dist">'+fmtD(x.d)+'</span>':'')+'</div>'}).join("")+'</div>';
    h+='<div class="act"><button class="btn" data-act="locate">Actualiser la position</button></div>';
    if(ui.pos)h+='<div class="sub" style="text-align:center">Précision GPS : ±'+Math.round(ui.pos.acc)+' m</div>';
    return h;
  }
  var todo=todoArts(),total=S.list.length,done=total-todo.length;
  h+='<div class="row"><button class="btn s" data-act="back">Changer de magasin</button></div>';
  h+='<div class="sub" style="margin-top:8px">Reste '+todo.length+' sur '+total+'</div><div class="bar"><i style="width:'+(total?Math.round(done/total*100):0)+'%"></i></div>';
  if(!todo.length)h+='<div class="empty">'+(total?'Tout est traité.':'Votre liste est vide.')+'</div>';
  grouped(todo).forEach(function(x){
    h+='<div class="cat">'+esc(x.cat.name.toUpperCase())+'</div><div class="card">'+x.items.map(function(a){
      var n=esc(a.name);
      return '<div class="it"><span class="nm">'+n+'</span><span class="ibs">'+
        '<button class="ib ok" data-act="set" data-s="taken" data-id="'+a.id+'" aria-label="Pris : '+n+'">'+IC.ok+'</button>'+
        '<button class="ib wa" data-act="set" data-s="na" data-id="'+a.id+'" aria-label="Indisponible : '+n+'">'+IC.na+'</button>'+
        '<button class="ib da" data-act="set" data-s="deleted" data-id="'+a.id+'" aria-label="Supprimer : '+n+'">'+IC.del+'</button></span></div>';
    }).join("")+'</div>';
  });
  var tr=S.list.filter(function(e){return e.status!=="todo"});
  if(tr.length){
    var L={taken:["Pris","b-taken"],na:["Indisponible","b-na"],deleted:["Supprimé","b-del"]};
    h+='<div class="cat">TRAITÉS</div><div class="card">'+tr.map(function(e){var a=art(e.articleId);if(!a)return "";var l=L[e.status];
      return '<div class="it"><span class="nm" style="'+(e.status==="taken"?"text-decoration:line-through;":"")+'color:var(--tx2)">'+esc(a.name)+'</span><span class="badge '+l[1]+'">'+l[0]+'</span><button class="btn s" data-act="undo" data-id="'+a.id+'" aria-label="Annuler">Annuler</button></div>'}).join("")+'</div>';
    h+='<div class="act"><button class="btn w" data-act="finish">Terminer les courses</button></div>';
  }
  return h;
}

function viewStores(){
  var h='<div class="card pad"><input id="sn" type="text" placeholder="Nom du magasin" autocomplete="off" autocapitalize="words" aria-label="Nom du magasin">'+(ui.shopErr?'<div class="err">'+esc(ui.shopErr)+'</div>':'')+
    '<button class="btn p w" style="margin-top:10px" data-act="addshop"'+(ui.busy?' disabled':'')+'>'+(ui.busy?"Localisation…":"Ajouter ma position actuelle")+'</button></div>';
  if(!S.shops.length)return h+'<div class="empty">Aucun magasin.<br>Rendez-vous sur place, saisissez le nom, puis ajoutez la position.</div>';
  h+='<div class="cat">ENREGISTRÉS</div><div class="card">'+S.shops.map(function(s){
    return '<div class="it"><div class="nm">'+esc(s.name)+'<div class="sub">'+s.lat.toFixed(5)+', '+s.lon.toFixed(5)+'</div></div><button class="btn s da" data-act="delshop" data-id="'+s.id+'" aria-label="Supprimer '+esc(s.name)+'">Supprimer</button></div>'}).join("")+'</div>';
  return h;
}

function viewSet(){
  var h=(needsCatalog()?catBanner():"")+'<div class="cat">DONNÉES</div><div class="card pad">'+
    '<button class="btn w" data-act="share">Partager la liste (Notes, Rappels, Messages)</button>'+
    '<button class="btn w" style="margin-top:8px" data-act="export">Exporter une sauvegarde (JSON)</button>'+
    '<button class="btn w" style="margin-top:8px" data-act="import">Importer une sauvegarde</button>'+
    '<div class="sub" id="persist" style="margin-top:10px">Stockage : local sur cet appareil.</div></div>';
  h+='<div class="cat">CATÉGORIES ET ARTICLES (ORDRE DES RAYONS)</div><div class="card">'+S.categories.map(function(c,i){
    var arts=S.articles.filter(function(a){return a.catId===c.id}).sort(function(x,y){return x.name.localeCompare(y.name,"fr")});
    var o=ui.openCat===c.id;
    var r='<div class="it"><span class="nm" data-act="catopen" data-id="'+c.id+'" style="cursor:pointer">'+(o?"▾ ":"▸ ")+esc(c.name)+' <span class="sub">('+arts.length+')</span></span><button class="btn s" data-act="catup" data-i="'+i+'" aria-label="Monter">↑</button><button class="btn s" data-act="catdown" data-i="'+i+'" aria-label="Descendre">↓</button><button class="btn s da" data-act="catdel" data-i="'+i+'" aria-label="Supprimer la catégorie">×</button></div>';
    if(o){
      r+=arts.length?arts.map(function(a){
        return '<div class="it" style="padding-left:18px"><span class="nm">'+esc(a.name)+'</span><button class="btn s" data-act="artmove" data-id="'+a.id+'">Déplacer</button><button class="btn s da" data-act="artdel" data-id="'+a.id+'" aria-label="Supprimer '+esc(a.name)+'">×</button></div>'+
          (ui.moveId===a.id?'<div style="padding:4px 0 8px 18px">'+S.categories.filter(function(x){return x.id!==c.id}).map(function(x){return '<button class="chip" data-act="artto" data-id="'+a.id+'" data-c="'+x.id+'">'+esc(x.name)+'</button>'}).join("")+'</div>':'');
      }).join(""):'<div class="sub" style="padding:8px 0 8px 18px">Aucun article.</div>';
    }
    return r;
  }).join("")+'</div>';
  h+='<div class="act"><button class="btn w" data-act="catadd">Ajouter une catégorie</button></div>';
  h+='<div class="sub" style="margin:8px 4px 0">'+S.articles.length+' articles au catalogue. Touchez une catégorie pour voir ses articles.</div>';
  h+='<div class="act" style="margin-top:16px"><button class="btn w da" data-act="reset">Réinitialiser toutes les données</button></div>';
  return h;
}

/* ---------- Actions ---------- */
function refreshSg(){var e=$("#sg");if(e)e.innerHTML=sgHtml()}
function onType(e){ui.draft=e.target.value;ui.err=null;ui.mode="typing";refreshSg()}
function addToList(id){
  var e=entry(id);
  if(e&&e.status==="todo"){toast("Déjà dans la liste");return false}
  if(e)e.status="todo";else S.list.push({articleId:id,status:"todo",ts:Date.now()});
  S.next=S.next.filter(function(x){return x!==id});
  return true;
}
function resetDraft(){ui.draft="";ui.mode="typing";ui.pending="";ui.err=null}
function afterAdd(){save();resetDraft();render();var q=$("#q");if(q)q.focus()}
function dl(name,blob){var u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){a.remove();URL.revokeObjectURL(u)},1000)}
function listText(){
  var g=grouped(todoArts());
  return "Courses\n"+g.map(function(x){return "\n"+x.cat.name+"\n"+x.items.map(function(a){return "- "+a.name}).join("\n")}).join("\n");
}

var act={
  tab:function(d){ui.tab=d.t;ui.sel=null;if(d.t==="run"&&!ui.shopId&&(!ui.pos||Date.now()-ui.pos.ts>60000))locate();render();if(d.t==="set")showPersist()},
  submit:function(){
    var name=ui.draft.trim();
    if(!name){ui.err="Saisissez un nom d'article.";refreshSg();return}
    var n=norm(name),ex=S.articles.find(function(a){return norm(a.name)===n});
    if(ex){addToList(ex.id);afterAdd();return}
    ui.pending=cap(name);ui.mode=similar(name,4).length?"confirm":"cat";ui.err=null;refreshSg();
  },
  pick:function(d){addToList(d.id);afterAdd()},
  cancel:function(){ui.mode="typing";ui.pending="";refreshSg()},
  tocat:function(){ui.mode="cat";refreshSg()},
  create:function(d){var a={id:uid(),name:ui.pending,catId:d.id};S.articles.push(a);addToList(a.id);afterAdd()},
  newcatcreate:function(){
    var n=prompt("Nom de la nouvelle catégorie");if(!n||!n.trim())return;
    var c={id:uid(),name:cap(n)};S.categories.push(c);act.create({id:c.id});
  },
  rm:function(d){S.list=S.list.filter(function(e){return e.articleId!==d.id});save();render()},
  nextadd:function(d){addToList(d.id);save();render()},
  nextall:function(){S.next.slice().forEach(addToList);S.next=[];save();render()},
  nextdel:function(d){S.next=S.next.filter(function(x){return x!==d.id});save();render()},
  /* magasins */
  addshop:function(){
    var n=(ui.shopName||"").trim();
    if(!n){ui.shopErr="Saisissez le nom du magasin.";render();return}
    ui.busy=true;render();
    getPos(true).then(function(p){
      S.shops.push({id:uid(),name:cap(n),lat:p.lat,lon:p.lon});ui.shopName="";save();toast("Magasin ajouté (±"+Math.round(p.acc)+" m)");
    }).catch(function(e){ui.shopErr=e.message}).then(function(){ui.busy=false;render()});
  },
  delshop:function(d){var s=shopById(d.id);if(s&&confirm("Supprimer "+s.name+" ?")){S.shops=S.shops.filter(function(x){return x.id!==d.id});if(ui.shopId===d.id)ui.shopId=null;save();render()}},
  /* courses */
  locate:function(){locate()},
  shop:function(d){ui.shopId=d.id;ui.sel=null;render()},
  back:function(){ui.shopId=null;ui.sel=null;if(!ui.pos||Date.now()-ui.pos.ts>60000)locate();render()},
  sel:function(d){ui.sel=ui.sel===d.id?null:d.id;render()},
  set:function(d){
    var e=entry(d.id);if(!e)return;e.status=d.s;
    if(d.s==="na"&&S.next.indexOf(d.id)<0)S.next.push(d.id);
    ui.sel=null;save();render();
    if(d.s==="na")toast("Ajouté aux prochains achats");
  },
  undo:function(d){var e=entry(d.id);if(!e)return;if(e.status==="na")S.next=S.next.filter(function(x){return x!==d.id});e.status="todo";save();render()},
  finish:function(){
    var rest=todoArts().length;
    if(rest&&!confirm(rest+" article(s) restent à faire. Terminer quand même ? Les articles traités seront retirés de la liste."))return;
    S.list=S.list.filter(function(e){return e.status==="todo"});ui.shopId=null;save();toast("Courses terminées");render();
  },
  /* reglages */
  share:function(){
    var t=listText();
    if(navigator.share)navigator.share({title:"Courses",text:t}).catch(function(){});
    else if(navigator.clipboard)navigator.clipboard.writeText(t).then(function(){toast("Liste copiée")});
    else toast("Partage indisponible");
  },
  export:function(){
    var blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}),name="courses-"+new Date().toISOString().slice(0,10)+".json";
    try{var f=new File([blob],name,{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:"Sauvegarde Courses"}).catch(function(){});return}}catch(e){}
    dl(name,blob);
  },
  import:function(){$("#file").click()},
  catopen:function(d){ui.openCat=ui.openCat===d.id?null:d.id;ui.moveId=null;render()},
  artmove:function(d){ui.moveId=ui.moveId===d.id?null:d.id;render()},
  artto:function(d){var x=art(d.id);if(x){x.catId=d.c;save()}ui.moveId=null;render();toast("Article déplacé")},
  artdel:function(d){
    var x=art(d.id);if(!x||!confirm("Supprimer « "+x.name+" » du catalogue ? Il sera aussi retiré de la liste et des prochains achats."))return;
    S.articles=S.articles.filter(function(a){return a.id!==d.id});S.list=S.list.filter(function(e){return e.articleId!==d.id});S.next=S.next.filter(function(n){return n!==d.id});
    save();render();
  },
  catalog:function(){applyCatalog(S);save();render();toast("Catalogue mis à jour")},
  catup:function(d){var i=+d.i;if(i>0){var c=S.categories;var t=c[i];c[i]=c[i-1];c[i-1]=t;save();render()}},
  catdown:function(d){var i=+d.i,c=S.categories;if(i<c.length-1){var t=c[i];c[i]=c[i+1];c[i+1]=t;save();render()}},
  catdel:function(d){
    var c=S.categories[+d.i];if(!c)return;
    if(S.articles.some(function(a){return a.catId===c.id})){toast("Catégorie utilisée par des articles");return}
    if(confirm("Supprimer la catégorie "+c.name+" ?")){S.categories.splice(+d.i,1);save();render()}
  },
  catadd:function(){var n=prompt("Nom de la catégorie");if(n&&n.trim()){S.categories.push({id:uid(),name:cap(n)});save();render()}},
  reset:function(){if(confirm("Effacer magasins, articles et listes ? Cette action est irréversible.")){S=seed();ui.shopId=null;save();render();toast("Données réinitialisées")}}
};
document.addEventListener("click",function(e){var b=e.target.closest("[data-act]");if(b&&!b.disabled&&act[b.dataset.act])act[b.dataset.act](b.dataset,b)});
$("#file").addEventListener("change",function(e){
  var f=e.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){try{var v=JSON.parse(r.result);if(!valid(v))throw 0;if(confirm("Remplacer les données actuelles par cette sauvegarde ?")){S=v;save();render();toast("Sauvegarde importée")}}catch(x){toast("Fichier invalide")}};
  r.readAsText(f);e.target.value="";
});
function showPersist(){
  var el=$("#persist");if(!el||!navigator.storage||!navigator.storage.persist)return;
  navigator.storage.persist().then(function(ok){var e=$("#persist");if(e)e.textContent="Stockage local sur cet appareil. Persistance : "+(ok?"garantie.":"non garantie, pensez à exporter régulièrement.")});
}

/* ---------- Demarrage ---------- */
load().then(function(){render()});
if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
</script>
</body>
</html>
